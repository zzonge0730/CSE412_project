monitor_wrapper =   $command
monitor_specrun_wrapper =   $command
ignore_errors = yes
tune          = base
ext           = wrapper-sbcets-o0
output_format = asc
reportable    = 1
teeout        = yes
teerunout     = yes
strict_rundir_verify = 0
makeflags = -j4

default=default=default=default:
CC  = ${HOME}/code/compiler-wrapper/wrapper.sh -std=gnu89 -m64 -fsoftboundcets -fno-vectorize
CXX = ${HOME}/code/softboundcets-34/softboundcets-llvm-clang34/Release/bin/clang++  -m64
EXTRA_LIBS = -L${HOME}/.local/lib/sbcets -lm -lrt
FC         = echo

default=base=default=default:
COPTIMIZE   = -O0
CXXOPTIMIZE = -O0

default=base=default=default:
PORTABILITY = -DSPEC_CPU_LP64

400.perlbench=default=default=default:
CPORTABILITY= -DSPEC_CPU_LINUX_X64

462.libquantum=default=default=default:
CPORTABILITY= -DSPEC_CPU_LINUX

483.xalancbmk=default=default=default:
CXXPORTABILITY= -DSPEC_CPU_LINUX -include string.h

447.dealII=default=default=default:
CXXPORTABILITY= -include cstring -include cstdlib -include cstddef

